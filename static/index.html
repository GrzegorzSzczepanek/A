<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF to DITA - Automated Documentation Conversion</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap');

    /* ===== RESET ===== */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* ===== THEME TOKENS ===== */
    :root {
      --font-heading: 'Space Grotesk', system-ui, sans-serif;
      --font-body: 'DM Sans', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, monospace;

      /* BNY-inspired palette */
      --teal-900: #04424F;
      --teal-700: #07677E;
      --teal-500: #2B9CAE;
      --teal-400: #4DB8C9;
      --teal-300: #6ABDC6;
      --teal-100: #D6F0F4;
      --teal-50: #EDF8FA;
      --navy-900: #00243D;
      --navy-700: #0A3A5C;
      --purple: #A460AD;
      --purple-light: #C490CC;
      --gold: #B07E25;
      --gold-light: #D4A94A;

      --concept-color: var(--purple);
      --task-color: var(--teal-500);
      --ref-color: var(--gold);
    }

    [data-theme="light"] {
      --bg: #F4F6F8;
      --surface: #FFFFFF;
      --surface-raised: #FFFFFF;
      --surface-sunken: #EDF0F3;
      --border: #D5DAE0;
      --border-light: #E8ECF0;
      --text: #0F1B2D;
      --text-secondary: #475569;
      --text-muted: #8494A7;
      --primary: var(--teal-700);
      --primary-hover: var(--teal-900);
      --primary-bg: var(--teal-50);
      --primary-border: var(--teal-100);
      --success: #15803D;
      --success-bg: #F0FDF4;
      --warning: #A16207;
      --warning-bg: #FEFCE8;
      --error: #B91C1C;
      --error-bg: #FEF2F2;
      --code-bg: #1B2332;
      --code-text: #D4D8DE;
      --code-gutter: #384050;
      --code-gutter-text: #606A7A;
      --code-tag: #7ABAFF;
      --code-attr: #C7A4FF;
      --code-string: #98D89A;
      --code-comment: #6A7383;
      --code-doctype: #D4A44A;
      --header-bg: var(--navy-900);
      --header-text: #F0F4F8;
      --header-muted: #8BA3BD;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.1);
      --concept-bg: #F5EDF6;
      --concept-border: #E4CEE8;
      --task-bg: var(--teal-50);
      --task-border: var(--teal-100);
      --ref-bg: #FEF7EC;
      --ref-border: #F5E6C8;
    }

    [data-theme="dark"] {
      --bg: #0B1120;
      --surface: #131C2E;
      --surface-raised: #192438;
      --surface-sunken: #0A0F1A;
      --border: #243044;
      --border-light: #1C2840;
      --text: #E2E8F0;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      --primary: var(--teal-400);
      --primary-hover: var(--teal-300);
      --primary-bg: rgba(43, 156, 174, 0.1);
      --primary-border: rgba(43, 156, 174, 0.2);
      --success: #4ADE80;
      --success-bg: rgba(74, 222, 128, 0.08);
      --warning: #FACC15;
      --warning-bg: rgba(250, 204, 21, 0.08);
      --error: #F87171;
      --error-bg: rgba(248, 113, 113, 0.08);
      --code-bg: #0D1424;
      --code-text: #D4D8DE;
      --code-gutter: #1A2336;
      --code-gutter-text: #4A5568;
      --code-tag: #7ABAFF;
      --code-attr: #C7A4FF;
      --code-string: #98D89A;
      --code-comment: #556270;
      --code-doctype: #D4A44A;
      --header-bg: #070D18;
      --header-text: #E2E8F0;
      --header-muted: #64748B;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.2);
      --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.4);
      --concept-bg: rgba(164, 96, 173, 0.1);
      --concept-border: rgba(164, 96, 173, 0.25);
      --task-bg: rgba(43, 156, 174, 0.1);
      --task-border: rgba(43, 156, 174, 0.25);
      --ref-bg: rgba(176, 126, 37, 0.1);
      --ref-border: rgba(176, 126, 37, 0.25);
    }

    /* ===== BASE ===== */
    html {
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      transition: background 0.3s, color 0.3s;
    }

    /* ===== SCROLLBAR ===== */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    /* ===== HEADER ===== */
    .app-header {
      background: var(--header-bg);
      color: var(--header-text);
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 50;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .app-header__brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: var(--font-heading);
    }

    .app-header__logo {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 11px;
      background: linear-gradient(135deg, var(--teal-500), var(--teal-700));
      color: white;
      letter-spacing: -0.02em;
    }

    .app-header__title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .app-header__subtitle {
      font-size: 11px;
      color: var(--header-muted);
      letter-spacing: 0.01em;
    }

    .app-header__nav {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ===== VIEW CONTAINER ===== */
    .view-container {
      max-width: 1320px;
      margin: 0 auto;
      padding: 28px 24px;
      min-height: calc(100vh - 52px);
    }

    /* ===== CARDS ===== */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .card--interactive:hover {
      border-color: var(--primary);
      box-shadow: var(--shadow-md);
    }

    /* ===== BUTTONS ===== */
    .btn {
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
      line-height: 1.3;
    }

    .btn:hover {
      background: var(--surface-sunken);
      border-color: var(--text-muted);
    }

    .btn--primary {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .btn--primary:hover {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
    }

    .btn--sm {
      padding: 5px 10px;
      font-size: 12px;
      border-radius: 5px;
    }

    .btn--ghost {
      background: transparent;
      border-color: transparent;
    }

    .btn--ghost:hover {
      background: var(--surface-sunken);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: default;
      pointer-events: none;
    }

    /* ===== TYPE BADGES ===== */
    .type-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 5px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      line-height: 1.4;
    }

    .type-badge--concept {
      background: var(--concept-bg);
      color: var(--concept-color);
      border: 1px solid var(--concept-border);
    }

    .type-badge--task {
      background: var(--task-bg);
      color: var(--task-color);
      border: 1px solid var(--task-border);
    }

    .type-badge--reference {
      background: var(--ref-bg);
      color: var(--ref-color);
      border: 1px solid var(--ref-border);
    }

    .type-badge--map {
      background: var(--primary-bg);
      color: var(--primary);
      border: 1px solid var(--primary-border);
    }

    .type-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }

    .type-dot--concept {
      background: var(--concept-color);
    }

    .type-dot--task {
      background: var(--task-color);
    }

    .type-dot--reference {
      background: var(--ref-color);
    }

    .type-dot--map {
      background: var(--primary);
    }

    /* ===== STATUS INDICATORS ===== */
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-dot--pass {
      background: var(--success);
    }

    .status-dot--fail {
      background: var(--error);
    }

    .status-dot--warn {
      background: var(--warning);
    }

    .status-dot--queued {
      background: var(--border);
    }

    .status-dot--active {
      background: var(--primary);
      animation: pulse-dot 1.2s ease-in-out infinite;
    }

    .status-dot--done {
      background: var(--success);
    }

    @keyframes pulse-dot {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.5;
        transform: scale(0.85);
      }
    }

    /* ===== DROP ZONE ===== */
    .dropzone {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 56px 32px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: var(--surface);
    }

    .dropzone:hover,
    .dropzone--active {
      border-color: var(--primary);
      background: var(--primary-bg);
    }

    .dropzone__icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 16px;
      border-radius: 10px;
      background: var(--primary-bg);
      border: 1px solid var(--primary-border);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dropzone__title {
      font-family: var(--font-heading);
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .dropzone__sub {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* ===== FILE TABLE ===== */
    .file-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .file-table th {
      text-align: left;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      font-weight: 500;
    }

    .file-table td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-light);
    }

    .file-table tr:last-child td {
      border-bottom: none;
    }

    /* ===== PIPELINE ===== */
    .pipeline-stepper {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 24px 16px;
      position: relative;
    }

    .pipeline-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      position: relative;
      z-index: 2;
      flex: 0 0 auto;
      width: 100px;
    }

    .pipeline-node {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
      position: relative;
    }

    .pipeline-node--active {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-bg);
    }

    .pipeline-node--done {
      border-color: var(--success);
      background: var(--success);
      color: white;
    }

    .pipeline-node--error {
      border-color: var(--error);
      background: var(--error);
      color: white;
    }

    .pipeline-label {
      font-size: 12px;
      font-weight: 500;
      text-align: center;
      color: var(--text-secondary);
      line-height: 1.3;
    }

    .pipeline-time {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-muted);
    }

    .pipeline-line {
      position: absolute;
      top: 42px;
      /* center of 36px node + 24px padding */
      left: 0;
      right: 0;
      height: 2px;
      background: var(--border);
      z-index: 1;
    }

    .pipeline-line__fill {
      height: 100%;
      background: var(--success);
      transition: width 0.4s ease;
      border-radius: 1px;
    }

    /* ===== LOG ===== */
    .log-panel {
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.8;
      padding: 16px 20px;
      background: var(--surface-sunken);
      border-top: 1px solid var(--border-light);
      border-radius: 0 0 10px 10px;
      max-height: 200px;
      overflow-y: auto;
    }

    .log-entry {
      display: flex;
      gap: 12px;
      animation: log-in 0.2s ease;
    }

    .log-time {
      color: var(--text-muted);
      white-space: nowrap;
    }

    .log-stage {
      color: var(--primary);
      font-weight: 500;
      white-space: nowrap;
      min-width: 120px;
    }

    .log-msg {
      color: var(--text-secondary);
    }

    @keyframes log-in {
      from {
        opacity: 0;
        transform: translateY(4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ===== RESULTS LAYOUT ===== */
    .results-grid {
      display: grid;
      grid-template-columns: 280px 1fr 300px;
      gap: 16px;
      height: calc(100vh - 160px);
      /* Fixed height for the whole area */
      min-height: 0;
    }

    @media (max-width: 1100px) {
      .results-grid {
        grid-template-columns: 240px 1fr;
        height: auto;
      }

      .results-grid> :last-child {
        grid-column: 1 / -1;
      }
    }

    /* Ensure each column container handles its own scroll */
    .results-grid>* {
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ===== PROJECT EXPLORER ===== */
    .project-explorer {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .search-container {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-light);
      background: var(--surface-sunken);
      border-radius: 10px 10px 0 0;
      flex-shrink: 0;
    }

    /* ... (search-input and other styles) */

    /* ===== CODE PREVIEW ===== */
    .code-preview {
      background: var(--code-bg);
      color: #FFF;
      border-radius: 8px;
      overflow: hidden;
      font-family: var(--font-mono);
      font-size: 12.5px;
      line-height: 1.7;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .code-preview__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.04);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      flex-shrink: 0;
    }

    .code-preview__body {
      overflow: auto;
      flex: 1;
      /* Take all available space in the card */
      min-height: 0;
      padding: 0;
    }

    /* ... (code-lines and other styles) */

    /* ===== HTML PREVIEW ===== */
    .html-preview {
      padding: 32px;
      background: var(--surface);
      border-radius: 8px;
      border: 1px solid var(--border);
      overflow: auto;
      flex: 1;
      /* Take all available space in the column */
      min-height: 0;
      font-size: 14px;
      line-height: 1.7;
    }

    .html-preview h1 {
      font-family: var(--font-heading);
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text);
    }

    .html-preview h2 {
      font-family: var(--font-heading);
      font-size: 17px;
      font-weight: 600;
      margin: 20px 0 8px;
      color: var(--text);
    }

    .html-preview p {
      margin-bottom: 10px;
      color: var(--text-secondary);
    }

    .html-preview .shortdesc {
      color: var(--text-muted);
      font-style: italic;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-light);
    }

    .html-preview ul,
    .html-preview ol {
      margin: 8px 0 12px 24px;
      color: var(--text-secondary);
    }

    .html-preview li {
      margin-bottom: 4px;
    }

    .html-preview code {
      background: var(--surface-sunken);
      padding: 1px 5px;
      border-radius: 3px;
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--primary);
    }

    .html-preview .ui-path {
      font-family: var(--font-mono);
      font-size: 13px;
      background: var(--surface-sunken);
      padding: 2px 6px;
      border-radius: 3px;
    }

    .html-preview .ui-ctrl {
      font-weight: 600;
      color: var(--text);
    }

    .html-preview .wintitle {
      font-style: italic;
      font-weight: 500;
    }

    .html-preview .prereq {
      background: var(--primary-bg);
      border: 1px solid var(--primary-border);
      border-radius: 6px;
      padding: 12px 16px;
      margin-bottom: 16px;
      font-size: 13px;
    }

    .html-preview .step-result {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .html-preview .step-info {
      font-size: 13px;
      color: var(--text-muted);
      font-style: italic;
    }

    .html-preview .img-placeholder {
      background: var(--surface-sunken);
      border: 1px dashed var(--border);
      border-radius: 6px;
      padding: 40px;
      text-align: center;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 12px;
      margin: 8px 0;
    }

    .html-preview figure {
      margin: 16px 0;
    }

    .html-preview figcaption {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .html-preview table.ref-table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0;
      font-size: 13px;
    }

    .html-preview table.ref-table caption {
      font-size: 13px;
      font-weight: 600;
      text-align: left;
      margin-bottom: 8px;
    }

    .html-preview table.ref-table th {
      background: var(--surface-sunken);
      text-align: left;
      padding: 8px 12px;
      border: 1px solid var(--border);
      font-weight: 600;
      font-size: 12px;
    }

    .html-preview table.ref-table td {
      padding: 8px 12px;
      border: 1px solid var(--border-light);
    }

    /* ===== VALIDATION PANEL ===== */
    .val-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border-light);
      font-size: 12px;
    }

    .val-item:last-child {
      border-bottom: none;
    }

    .val-label {
      font-weight: 500;
      color: var(--text);
    }

    .val-detail {
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* ===== SEMANTIC TAGS ===== */
    .sem-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--surface-sunken);
      border: 1px solid var(--border-light);
      border-radius: 4px;
      padding: 3px 7px;
      font-size: 11px;
      font-family: var(--font-mono);
    }

    .sem-tag__count {
      color: var(--text-muted);
      font-weight: 500;
    }

    /* ===== COMPARISON OVERLAY ===== */
    .comparison-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      animation: fade-in 0.2s ease;
    }

    .comparison-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      max-width: 960px;
      width: 100%;
      max-height: 80vh;
      overflow: hidden;
      box-shadow: var(--shadow-lg);
    }

    .comparison-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .comparison-body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      overflow-y: auto;
      max-height: calc(80vh - 60px);
    }

    .comparison-col {
      padding: 20px;
    }

    .comparison-col:first-child {
      border-right: 1px solid var(--border);
    }

    .comparison-col__title {
      font-family: var(--font-heading);
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    /* Structure tree in comparison */
    .struct-node {
      padding: 6px 10px;
      border-radius: 5px;
      font-size: 12px;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--border-light);
      background: var(--surface);
    }

    .struct-children {
      padding-left: 16px;
      border-left: 1px solid var(--border-light);
      margin-left: 12px;
      margin-bottom: 4px;
    }

    /* ===== KEYBOARD HINTS ===== */
    .kbd {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 20px;
      height: 20px;
      padding: 0 5px;
      background: var(--surface-sunken);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 500;
      color: var(--text-muted);
      line-height: 1;
    }

    /* ===== DOCUMENT TABS ===== */
    .doc-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .doc-tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-secondary);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      font-size: 13px;
      font-weight: 500;
      font-family: var(--font-body);
    }

    .doc-tab:hover {
      border-color: var(--text-muted);
      background: var(--surface-sunken);
    }

    .doc-tab--active {
      background: var(--primary-bg);
      border-color: var(--primary);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    .doc-tab__label {
      max-width: 240px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ===== PROJECT EXPLORER ===== */
    .project-explorer {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .search-container {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-light);
      background: var(--surface-sunken);
      border-radius: 10px 10px 0 0;
    }

    .search-input {
      width: 100%;
      padding: 6px 30px 6px 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 12px;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--primary);
    }

    .doc-node {
      border-bottom: 1px solid var(--border-light);
    }

    .doc-node__header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .doc-node__header:hover {
      background: var(--surface-sunken);
    }

    .doc-node--active .doc-node__header {
      background: var(--primary-bg);
      color: var(--primary);
    }

    .doc-node__title {
      font-size: 12px;
      font-weight: 600;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .doc-node__content {
      padding: 4px 0 8px 0;
    }

    /* ===== ANIMATIONS ===== */
    @keyframes fade-in {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes slide-up {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .anim-fade {
      animation: fade-in 0.3s ease;
    }

    .anim-slide {
      animation: slide-up 0.35s ease;
    }

    /* ===== MISC ===== */
    .section-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      font-weight: 500;
      margin-bottom: 10px;
    }

    .divider {
      height: 1px;
      background: var(--border-light);
      margin: 12px 0;
    }

    .metric-card {
      background: var(--surface-sunken);
      border: 1px solid var(--border-light);
      border-radius: 7px;
      padding: 10px 14px;
    }

    .metric-card__label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 500;
    }

    .metric-card__value {
      font-family: var(--font-heading);
      font-size: 20px;
      font-weight: 700;
      margin-top: 2px;
    }

    .metric-card__value--pass {
      color: var(--success);
    }

    /* ===== Theme toggle button ===== */
    .theme-toggle {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.06);
      color: var(--header-text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
      font-size: 14px;
    }

    .theme-toggle:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    /* ===== View transition wrapper ===== */
    .view-enter {
      animation: slide-up 0.35s ease both;
    }

    /* Breadcrumb nav */
    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
    }

    .breadcrumb__item {
      padding: 4px 10px;
      border-radius: 5px;
      background: transparent;
      border: none;
      color: var(--header-muted);
      font-family: var(--font-body);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
      font-weight: 500;
    }

    .breadcrumb__item:hover {
      color: var(--header-text);
      background: rgba(255, 255, 255, 0.06);
    }

    .breadcrumb__item--active {
      color: var(--header-text);
    }

    .breadcrumb__sep {
      color: var(--header-muted);
      font-size: 10px;
    }

    /* File upload area sample button */
    .sample-btn {
      margin-top: 16px;
      font-size: 12px;
      color: var(--primary);
      background: none;
      border: 1px solid var(--primary-border);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-family: var(--font-body);
      font-weight: 500;
      transition: all 0.15s;
    }

    .sample-btn:hover {
      background: var(--primary-bg);
      border-color: var(--primary);
    }
